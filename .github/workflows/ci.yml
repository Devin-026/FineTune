name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate translations
        run: python3 scripts/validate_localization.py

      - name: Build
        run: |
          xcodebuild build \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Debug \
            -skip-testing:FineTuneUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 7

      - name: Build community app
        run: |
          xcodebuild build \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Release \
            -derivedDataPath build/Community \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
          codesign --force --deep --sign - build/Community/Build/Products/Release/FineTune.app
          codesign --verify --deep --strict build/Community/Build/Products/Release/FineTune.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/Community/Build/Products/Release/FineTune.app \
            build/FineTune-Chinese.zip

      - name: Upload community app
        uses: actions/upload-artifact@v4
        with:
          name: FineTune-Chinese
          path: build/FineTune-Chinese.zip
          retention-days: 30
